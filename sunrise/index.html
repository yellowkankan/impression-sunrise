<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="走进莫奈《印象·日出》：拨开晨雾，在画里漫游，和光赛跑画出倒影。">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>走进《印象·日出》</title>
<style>@font-face{font-family:"ZCOOL XiaoWei";src:url(../fonts/zcool-xiaowei.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:"Noto Serif SC";src:url(../fonts/noto-serif-sc-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:"Noto Serif SC";src:url(../fonts/noto-serif-sc-600.woff2) format("woff2");font-weight:600;font-style:normal;font-display:swap}@font-face{font-family:"IM Fell English";src:url(../fonts/im-fell-english.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:"IM Fell English";src:url(../fonts/im-fell-english-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}</style>
<style>
/* Layout: 整个页面就是这幅画。全屏、不滚动；场景之间用笔触重新画出画面，文字像颜料一样浮在雾里 */
:root{
  --deep:#111917;
  --fog:#efeae0;
  --mist:#c3ccc5;
  --sun:#e0694a;
  --peach:#f0b89c;
  --shade:rgba(12,18,16,.9);
  --f-display:"ZCOOL XiaoWei","Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-latin:"IM Fell English","Iowan Old Style",Georgia,serif;
  --gut-l:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--deep);color:var(--fog);font-family:var(--f-body);overflow:hidden;margin:0;
  padding-left:var(--gut-l);padding-right:var(--gut-r)}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--deep);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#endBtns{position:absolute;z-index:6;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh);transform:translateX(-50%);display:flex;gap:12px;flex-wrap:wrap;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1s}
#endBtns.on{opacity:1;pointer-events:auto}
#endBtns button{-webkit-touch-callout:none;font:inherit;font-size:15px;letter-spacing:.08em;color:var(--fog);background:rgba(12,18,16,.55);border:1px solid rgba(239,234,224,.35);padding:11px 20px;border-radius:18px 26px 16px 24px / 22px 16px 26px 18px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#endBtns button:hover{background:rgba(224,105,74,.35)}
#endBtns button:focus-visible{outline:1px solid var(--peach);outline-offset:3px}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage.pointer{cursor:pointer}
#stage.brush{cursor:crosshair}

/* 文字：没有卡片，直接浮在画上 */
#words{position:absolute;z-index:3;display:grid;gap:14px;max-width:min(560px,calc(100vw - 32px));pointer-events:none}
#words::before{content:"";position:absolute;inset:-90px -140px;z-index:-1;background:radial-gradient(closest-side,rgba(12,18,16,.5),rgba(12,18,16,.18) 60%,rgba(12,18,16,0));opacity:0;transition:opacity .8s}
#words.has::before{opacity:1}
#words.nobg::before{display:none}
#words.bl{left:calc(var(--gut-l) + 4vw);bottom:calc(env(safe-area-inset-bottom,0px) + 12vh)}
#words.tl{left:calc(var(--gut-l) + 4vw);top:calc(env(safe-area-inset-top,0px) + 12vh)}
#words.br{right:calc(var(--gut-r) + 4vw);bottom:calc(env(safe-area-inset-bottom,0px) + 12vh);text-align:right}
#words.c{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;max-width:min(760px,calc(100vw - 32px))}
.line{margin:0;font-family:var(--f-display);font-size:clamp(21px,2.3vw,30px);line-height:1.55;letter-spacing:.04em;
  text-shadow:0 0 14px rgba(10,16,14,.85),0 0 32px rgba(10,16,14,.6);animation:paintIn 1.5s cubic-bezier(.2,.7,.2,1) both}
.line em{font-style:normal;color:var(--peach)}
.line.small{font-family:var(--f-body);font-size:clamp(14px,1.25vw,16px);line-height:1.8;color:var(--mist);letter-spacing:0}
.line.title{font-size:clamp(58px,10vw,124px);letter-spacing:.1em;line-height:1.1}
.line.title b{color:var(--sun);font-weight:400}
.line.fr{font-family:var(--f-latin);font-style:italic;font-size:clamp(20px,2.4vw,30px);color:var(--mist);letter-spacing:.02em}
.line.dark{color:#1d2725;text-shadow:0 0 18px rgba(240,240,232,.9)}
.line.fr.dark,.line.small.dark{color:#3d4a46}
#words.out .line{animation:paintOut .7s ease-in both}
@keyframes paintIn{0%{opacity:0;filter:blur(12px);clip-path:inset(-60px 100% -60px -80px);transform:translateX(-6px)}60%{opacity:1}100%{opacity:1;filter:blur(0);clip-path:inset(-60px -80px -60px -80px);transform:none}}
@keyframes paintOut{to{opacity:0;filter:blur(10px);transform:translateY(-6px)}}

#hint.dark{color:#1d2725;text-shadow:0 0 12px rgba(240,240,232,.9)}
#hint{position:absolute;z-index:3;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 4.5vh);transform:translateX(-50%);
  font-size:15px;letter-spacing:.12em;color:var(--fog);opacity:0;transition:opacity .9s;pointer-events:none;white-space:nowrap;
  text-shadow:0 0 12px rgba(10,16,14,.95)}
#hint.on{opacity:.9;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{opacity:.5}}
#tag{position:absolute;z-index:4;pointer-events:none;font-family:var(--f-display);font-size:18px;color:var(--fog);
  text-shadow:0 0 10px rgba(10,16,14,.95);opacity:0;transition:opacity .25s;transform:translate(16px,-28px);white-space:nowrap}
#tag.on{opacity:1}
#clock{position:absolute;z-index:3;right:calc(var(--gut-r) + 4vw);top:calc(env(safe-area-inset-top,0px) + 8vh);text-align:right;
  font-family:var(--f-latin);font-size:clamp(40px,5vw,64px);line-height:1;opacity:0;transition:opacity .6s;pointer-events:none;
  text-shadow:0 0 18px rgba(10,16,14,.8);font-variant-numeric:tabular-nums}
#clock small{display:block;font-family:var(--f-body);font-size:14px;color:var(--mist);margin-top:8px;letter-spacing:.1em}
#clock.on{opacity:1}
.corner{position:absolute;z-index:5;font-size:13px;letter-spacing:.14em;color:var(--mist);text-shadow:0 0 10px rgba(10,16,14,.95)}
#brand{left:calc(var(--gut-l) + 2px);top:calc(env(safe-area-inset-top,0px) + 6px);padding:8px 10px;font-family:var(--f-display);font-size:16px;letter-spacing:.2em;color:var(--mist);text-decoration:none}
#brand:hover{color:var(--fog)}
#brand:focus-visible{outline:1px solid var(--peach);outline-offset:2px}
#brand b{color:var(--sun);font-weight:400}
#soundBtn,#nextBtn{background:none;border:0;padding:8px 10px;font:inherit;font-size:13px;letter-spacing:.14em;color:var(--mist);cursor:pointer}
#soundBtn{right:calc(var(--gut-r) + 4px);top:calc(env(safe-area-inset-top,0px) + 6px)}
#nextBtn{right:calc(var(--gut-r) + 4px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);opacity:0;transition:opacity .6s;pointer-events:none}
#nextBtn.on{opacity:.75;pointer-events:auto}
#soundBtn:hover,#nextBtn:hover{color:var(--fog)}
#soundBtn:focus-visible,#nextBtn:focus-visible{outline:1px solid var(--peach);outline-offset:2px}
#dots{left:50%;top:calc(env(safe-area-inset-top,0px) + 20px);transform:translateX(-50%);display:flex;gap:8px;pointer-events:none}
#dots i{width:9px;height:7px;border-radius:60% 40% 55% 45%;background:rgba(239,234,224,.25);transition:background .5s}
#dots i.on{background:var(--peach)}
@media (max-width:700px){
  #words.bl,#words.br,#words.tl{left:var(--gut-l);right:var(--gut-r);bottom:calc(env(safe-area-inset-bottom,0px) + 11vh);top:auto;text-align:left;max-width:none;padding-inline:6px}
  .line{font-size:18px;line-height:1.6}
  .line.small{font-size:13.5px}
  #words{gap:10px}
  #words::before{inset:-60px -40px}
  #clock{top:calc(env(safe-area-inset-top,0px) + 48px)}
  #endBtns{bottom:calc(env(safe-area-inset-bottom,0px) + 7vh)}
  #hint{white-space:normal;text-align:center;width:calc(100vw - 48px)}
}
@media (prefers-reduced-motion:reduce){.line,#words.out .line{animation-duration:.01s}#hint.on{animation:none}}

/* 手机横屏：屏幕很矮，文字缩小、位置下移 */
@media (max-height:500px) and (min-aspect-ratio:1/1){
  .line{font-size:17px;line-height:1.5}
  .line.small{font-size:12.5px}
  .line.title{font-size:44px}
  #words{gap:6px;max-width:min(480px,52vw)}
  #words.bl,#words.tl{bottom:calc(env(safe-area-inset-bottom,0px) + 9vh);top:auto}
  #words.br{bottom:calc(env(safe-area-inset-bottom,0px) + 9vh)}
  #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 2vh);font-size:13px}
  #clock{top:calc(env(safe-area-inset-top,0px) + 34px);font-size:34px}
}
/* 触屏：角落的按钮点起来更容易 */
@media (pointer:coarse){#soundBtn,#nextBtn{padding:12px 14px}#brand{padding:12px 14px}}
.line{text-wrap:pretty}
</style>

</head>
<body>
<div id="stage" role="application" aria-label="《印象·日出》互动漫游">
  <canvas id="paint"></canvas>
  <canvas id="fx"></canvas>
  <div id="words" class="c" aria-live="polite"></div>
  <div id="hint"></div>
  <div id="tag"></div>
  <div id="clock"></div>
  <a id="brand" class="corner" href="../">← 展厅</a>
  <div id="dots" class="corner" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <button id="soundBtn" class="corner" type="button">声音 关</button>
  <button id="nextBtn" class="corner" type="button">继续 →</button>
  <div id="endBtns"><button id="againHub" type="button">再逛一逛港口</button><button id="againAll" type="button">从头看一遍</button><button id="toHall" type="button">回到展厅</button></div>
</div>

nextBtn.addEventListener('click', e => { e.stopPropagation(); if (onTap) onTap(); else if (targets.find(t => !t.seen && t.go)) targets.find(t => !t.seen && t.go).go(); });
addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ') { if (painting) painting.done(); else nextBtn.click(); e.preventDefault(); } if (e.key === 'Escape' && hub.ready) hub.go(); });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (size()) { if (painting) painting.done(); P.fillStyle = '#111917'; P.fillRect(0, 0, SW, SH); drawView(P, view); } }, 120); });

/* 等一次点击（点画面任意处或“继续”） */
function waitTap(text = '点击画面继续') { return new Promise(res => { setTimeout(() => { hint(text); onTap = () => { onTap = null; hint(''); stage.classList.remove('pointer'); res(); }; }, 500); }); }

/* ---------- 故事 ---------- */
const dots = [...document.querySelectorAll('#dots i')];
const FULL = { src: 'orig', cx: 0.5, cy: 0.5, z: 1 };
const PLACES = [
  { id: 'harbor', name: '烟与桅杆', x: 520, y: 420, rx: 280, ry: 230, view: { src: 'orig', cx: 0.25, cy: 0.3, z: 2.3 }, pos: 'br', lines: [
    '左边这团打着旋的蓝绿色，是蒸汽船冒出的烟。', '后面密密麻麻的竖线，是帆船的桅杆。', '一座忙碌的工业港口。<br>可是没有一根桅杆，被画清楚。'] },
  { id: 'cranes', name: '对岸的吊车', x: 1680, y: 560, rx: 260, ry: 140, view: { src: 'orig', cx: 0.76, cy: 0.38, z: 2.3 }, pos: 'bl', lines: [
    '对岸是船坞和吊车。勒阿弗尔是当时法国最繁忙的港口之一。', '可在画里，它们只是雾中几道斜线。', '莫奈画的不是港口。<br>他画的是港口上空的<em>雾和光</em>。'] },
  { id: 'refl', name: '水里的倒影', x: 1215, y: 1050, rx: 100, ry: 250, lx: 1330, ly: 900, view: { src: 'orig', cx: 0.61, cy: 0.69, z: 3.2 }, pos: 'bl', lines: [
    '太阳的倒影，是一串横着的短笔。', '颜料堆得很厚，一笔下去，不再修改。', '笔和笔之间，直接露出水的颜色。'] },
  { id: 'boat', name: '小船', x: 950, y: 1110, rx: 140, ry: 130, lx: 850, ly: 1250, view: { src: 'orig', cx: 0.47, cy: 0.72, z: 3.4 }, pos: 'br', lines: [
    '一条船，一个站着摇桨的人。', '几笔深色。没有脸，也没有桨的细节。', '在晨雾里，你本来也看不清这些。<br>他画的是<em>眼睛看到的</em>，不是脑子里知道的。'] }
];
const SUNT = { id: 'sun', name: '太阳', x: 1217, y: 480, rx: 90, ry: 90 };
const hub = { ready: false, first: true, async go() {} };

async function run() {
  // 开场：画面在浓雾里一笔笔出现
  setFog(0.9, true); fogRegrow = 0.02;
  paintTo(FULL, { from: 'black' });
  await say([{ t: '印象<b>·</b>日出', cls: 'title dark' }, { t: 'Impression, soleil levant', cls: 'fr dark' }, { t: '克劳德·莫奈，1872', cls: 'small dark' }], 'c nobg', 700);
  hintEl.classList.add('dark'); await waitTap('点击任意处，走进 1872 年的清晨　建议戴上耳机'); hintEl.classList.remove('dark');
  soundOn();
  // 拨开晨雾
  fogRegrow = 0.0015;
  await say([{ t: '1872 年 11 月 13 日，早上 7 点 35 分。', cls: 'dark' }, { t: '法国北部，勒阿弗尔港。', cls: 'dark' }, { t: matchMedia('(pointer: coarse)').matches ? '用手指拨开晨雾。' : '晃动鼠标，拨开晨雾。', cls: 'dark small' }], 'c nobg', 1400);
  await new Promise(res => { const chk = setInterval(() => { if (fogCleared() > 0.4) { clearInterval(chk); onTap = null; hint(''); res(); } }, 200); setTimeout(() => { hint('点击画面继续'); onTap = () => { clearInterval(chk); onTap = null; hint(''); res(); }; }, 7000); });
  setFog(0.14); fogRegrow = 0.012;
  clearWords(); await sleep(700);
  await say(['31 岁的莫奈，站在港口边一家旅馆的窗前。', '这是他长大的城市。明天，是他 32 岁的生日。', { t: '这个时刻，是天文学家唐纳德·奥尔森根据画里太阳的位置和当天的潮汐推算出来的。', cls: 'small' }], 'bl');
  await waitTap();
  await explore();
}

async function explore() {
  hub.ready = true;
  const go = async () => {
    targets = []; await paintTo(FULL); setFog(0.14); shimmer = true;
    const left = PLACES.filter(p => !p.seen);
    if (left.length) {
      targets = PLACES.map(p => Object.assign(p, { go: () => visit(p) }));
      const msg = hub.first ? ['窗外有烟、有吊车、有小船，还有水里的倒影。', '在画里找到它们，点一下，凑近看看。'] : [`还有 ${left.length} 处没看。`];
      hub.first = false; say(msg, 'bl');
      hint(coarse ? '点画里标出的地方' : '把鼠标移到画里发亮的地方');
    } else {
      targets = [Object.assign(SUNT, { go: () => { targets = []; climax(); } })];
      say(['港口看完了。', '现在，看看那颗<em>太阳</em>。'], 'bl'); hint('点击太阳');
    }
  };
  hub.go = go; await go();
}
async function visit(p) {
  targets = []; hint(''); clearWords(); shimmer = false;
  await paintTo(p.view); setFog(0.08); shimmer = p.id === 'refl' || p.id === 'boat';
  p.seen = true; dots[PLACES.indexOf(p)].classList.add('on');
  await say(p.lines, p.pos);
  await waitTap('点击画面，退后一步');
  clearWords(); hub.go();
}

async function climax() {
  hub.ready = false; hint(''); clearWords(); shimmer = false;
  await paintTo({ src: 'orig', cx: 0.6, cy: 0.33, z: 1.9 }); shimmer = true;
  await say(['太阳刚升起二十多分钟。', '这样的光，只会停留几十分钟。'], 'bl');
  clockEl.innerHTML = '07:35<small>勒阿弗尔</small>'; clockEl.classList.add('on');
  lightTarget = 0;
  for (let m = 35; m <= 55; m++) { clockEl.innerHTML = `07:${m}<small>勒阿弗尔</small>`; lightTarget = (m - 35) / 20; setFog(0.14 - (m - 35) / 20 * 0.12); await sleep(reduce ? 20 : 170); }
  await say(['雾在散，光在变。', '等他调好颜色，眼前已经是另一幅景色。', '所以，他必须画得<em>很快</em>。'], 'bl');
  await waitTap('点击画面，拿起画笔');
  clockEl.classList.remove('on'); lightTarget = 0; light = 0; clearWords();
  await race();
}

async function race() {
  shimmer = false; setFog(0.06);
  const RV = SW < SH * 0.95 ? { cx: 0.6, cy: 0.5, z: 1.8 } : { cx: 0.5, cy: 0.5, z: 1 };
  await paintTo(Object.assign({ src: 'noRefl' }, RV));
  await say(['倒影被抹掉了。', '你有 <em>20 秒</em>，把它画回去。', { t: '在太阳正下方的水面上，横着画一些短短的、断开的橙红色笔触。落下第一笔，时钟就开始走。', cls: 'small' }], 'tl', 900);
  const ORANGE = [228, 112, 78], BW = Math.max(6 * DPR, Math.min(SW, SH) / 70), MAXLEN = Math.max(60 * DPR, Math.min(SW, SH) / 9);
  let strokesN = 0, inRefl = 0, startT = 0, cur = null, ended = false;
  const bristles = () => { const r = rng((Math.random() * 1e9) | 0); return Array.from({ length: 7 }, (_, i) => ({ o: (i / 6 - 0.5) * BW * (0.8 + r() * 0.4), j: [(r() - 0.5) * 34, (r() - 0.5) * 30, (r() - 0.5) * 26], a: 0.55 + r() * 0.45, lw: BW / 7 * 2 })); };
  await new Promise(done => {
    brush = {
      down(x, y) {
        if (ended) return;
        if (!startT) { startT = performance.now(); clearWords(); clockEl.classList.add('on'); tick(); }
        cur = { pts: [[x, y]], len: 0, br: bristles() }; strokesN++;
      },
      move(x, y) {
        if (!cur || ended) return; const p = cur.pts[cur.pts.length - 1], d = Math.hypot(x - p[0], y - p[1]); if (d < 2 || cur.len >= MAXLEN) return;
        cur.len += d; const f = cur.len / MAXLEN, fade = 1 - f * f * 0.85, nx = -(y - p[1]) / d, ny = (x - p[0]) / d; P.lineCap = 'round';
        cur.br.forEach(b => { if (f > 0.45 && Math.random() < (f - 0.45) * 1.4) return; P.strokeStyle = rgba([ORANGE[0] + b.j[0], ORANGE[1] + b.j[1], ORANGE[2] + b.j[2]], (0.95 * b.a * fade).toFixed(2)); P.lineWidth = b.lw;
          P.beginPath(); P.moveTo(p[0] + nx * b.o, p[1] + ny * b.o); P.lineTo(x + nx * b.o, y + ny * b.o); P.stroke(); });
        cur.pts.push([x, y]);
      },
      up() { if (!cur) return; const n = cur.pts.length; if (n > 2) { const ax = cur.pts.reduce((a, q) => a + q[0], 0) / n, ay = cur.pts.reduce((a, q) => a + q[1], 0) / n, [ix, iy] = toImg(view, ax, ay); if (Math.abs(ix - 1217) < 150 && iy > 790) inRefl++; } cur = null; }
    };
    stage.classList.add('brush');
    const tick = () => {
      const el = (performance.now() - startT) / 1000, p = Math.min(1, el / 20);
      clockEl.innerHTML = `${Math.max(0, Math.ceil(20 - el))}<small>07:${35 + Math.round(p * 20)} · 光在变</small>`;
      lightTarget = p * 0.9; light = lightTarget;
      if (el >= 20) { ended = true; brush = null; stage.classList.remove('brush'); done(); return; }
      requestAnimationFrame(tick);
    };
  });
  await sleep(400);
  await say([`时间到。光已经变了。`, `你画了 ${strokesN} 笔，${inRefl} 笔落在倒影里。`, inRefl >= 5 ? '快、短、不修改。你已经在用莫奈的方法了。' : '来不及吧？莫奈那天早上，面对的就是这种紧迫。'], 'tl', 1200);
  await waitTap('点击画面，看莫奈画的');
  clockEl.classList.remove('on'); lightTarget = 0; clearWords();
  await sleep(300); light = 0;
  await paintTo(Object.assign({ src: 'orig' }, RV)); shimmer = true;
  await say(['这是莫奈画的倒影。'], 'tl');
  await waitTap();
  await secret();
}

async function secret() {
  clearWords();
  await say(['太阳是整幅画里最显眼的东西。', '可它其实一点也不亮。'], 'bl');
  hint('按住画面不放，把颜色拿掉');
  let held = 0, t0 = 0;
  await new Promise(res => {
    onHold = async down => {
      if (down) { t0 = performance.now(); grayTarget = 1; hint(''); if (!held) say(['太阳不见了。', '它的亮度是 <em>128</em>，周围的天空是 <em>130</em>。', { t: '亮度从 0（纯黑）到 255（纯白），由程序在这张数字图像上测得。', cls: 'small' }], 'bl', 1100); }
      else { grayTarget = 0; if (performance.now() - t0 > 700) held++; if (held >= 1) { onHold = null; res(); } else hint('按住画面不放，把颜色拿掉'); }
    };
  });
  await sleep(500);
  await say(['我们的眼睛，一部分只管明暗，一部分只管颜色。', '明暗那部分看不见这颗太阳，颜色那部分看得很清楚。', '两边对不上，太阳就像在<em>颤动、发光</em>。', { t: '这是神经科学家玛格丽特·利文斯通在《视觉与艺术》里提出的解释。', cls: 'small' }], 'bl');
  await waitTap();
  await paris();
}

async function paris() {
  clearWords(); shimmer = false; setFog(0.05);
  if (SRC.meis) {
    await paintTo({ src: 'meis', cx: 0.5, cy: 0.5, z: 1 });
    await say(['可在当时，这不叫“好画”。', '这是那个年代最受追捧的画家之一梅索尼埃的作品：拿破仑骑着白马，带着部下走过泥泞的雪地。', '每一匹马、每一颗扣子都画得清清楚楚。表面光滑，看不见一笔笔触。', { t: '欧内斯特·梅索尼埃《1814 年法国战役》，1864 年，巴黎奥赛博物馆藏。', cls: 'small' }], 'bl');
    await waitTap();
    clearWords();
  }
  await paintTo({ src: 'orig', cx: 0.22, cy: 0.16, z: 2.6 });
  await say(SRC.meis ? ['再看莫奈的天空。', '每一笔都看得见。有的地方，薄到露出了画布。', '在当时的评委眼里，这根本就是一张没画完的草稿。'] : ['可在当时，这不叫“好画”。', '官方沙龙喜欢的画，表面光滑得像瓷器，看不见一笔笔触。画的是历史、神话和英雄，在画室里一改就是几个月。', '而这幅画，每一笔都看得见。天空有的地方，薄到露出了画布。'], 'br');
  await waitTap();
  clearWords(); setFog(0.14);
  await paintTo(FULL); shimmer = true;
  await say(['1874 年，莫奈把这幅画送去展览。', '一位评论家写道：<br>“还没完工的墙纸，都比这幅海景画得更完整。”', '他借这幅画的标题，嘲笑这群画家是<em>“印象派”</em>。', { t: '路易·勒鲁瓦，《喧哗》报，1874 年 4 月 25 日。画家们后来干脆接受了这个名字。', cls: 'small' }], 'bl');
  await waitTap();
  clearWords(); setFog(0.3); fogRegrow = 0.004;
  await say(['他确实没有画完。', '他想留住的，只是那二十分钟的光。'], 'c', 1800);
  await sleep(1200);
  await say(['他确实没有画完。', '他想留住的，只是那二十分钟的光。', { t: '展厅里还有三幅莫奈，下一幅是《撑阳伞的女人》。', cls: 'small' }], 'c', 0);
  await sleep(800);
  const endBtns = $('#endBtns'); endBtns.classList.add('on');
  const choice = await new Promise(res => { $('#againHub').onclick = () => res('hub'); $('#againAll').onclick = () => res('all'); });
  endBtns.classList.remove('on'); clearWords();
  PLACES.forEach(p => { p.seen = false; }); dots.forEach(d => d.classList.remove('on')); hub.first = true;
  if (choice === 'all') { setFog(0.9); fogRegrow = 0.02; await sleep(900); run(); return; }
  setFog(0.14); fogRegrow = 0.012; await explore();
}
})();
</script>
