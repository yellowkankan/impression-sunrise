<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>印象画室</title>
<meta name="description" content="一面展墙，四幅莫奈。沿着墙走，走进画里，看懂印象派在看什么。">
<meta property="og:title" content="印象画室">
<meta property="og:image" content="gallery/sunrise-thumb.jpg">
<style>@font-face{font-family:"ZCOOL XiaoWei";src:url(fonts/zcool-xiaowei.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:"Noto Serif SC";src:url(fonts/noto-serif-sc-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:"Noto Serif SC";src:url(fonts/noto-serif-sc-600.woff2) format("woff2");font-weight:600;font-style:normal;font-display:swap}@font-face{font-family:"IM Fell English";src:url(fonts/im-fell-english.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:"IM Fell English";src:url(fonts/im-fell-english-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}</style>
<style>
/* Layout: 一面横向的展墙。画按参观顺序挂成一排，走到哪幅，哪幅被灯照亮，下面出现展签 */
:root{
  --wall:#18211f;
  --deep:#0f1614;
  --fog:#efeae0;
  --mist:#a9b6af;
  --sun:#e0694a;
  --peach:#f0b89c;
  --paper:#f2eee4;
  --ink:#1f2523;
  --frame:#ddd8c7;
  --f-display:"ZCOOL XiaoWei","Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-latin:"IM Fell English","Iowan Old Style",Georgia,serif;
  --gut-l:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--fog);font-family:var(--f-body);overflow:hidden;
  padding-left:var(--gut-l);padding-right:var(--gut-r)}
#hall{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:grab}
#hall.drag{cursor:grabbing}
#wall{position:absolute;inset:0;background-repeat:repeat-x;background-size:auto 100%;opacity:.9}
#floor{position:absolute;left:0;right:0;bottom:0;height:16vh;background:linear-gradient(180deg,rgba(8,12,11,0),rgba(8,12,11,.75) 30%,rgba(6,9,8,.95));pointer-events:none}
#floor::before{content:"";position:absolute;left:0;right:0;top:30%;height:1px;background:rgba(239,234,224,.08)}
#track{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;gap:clamp(90px,14vw,220px);padding:0 50vw;will-change:transform}

.item{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;transition:opacity .7s,filter .7s,transform .7s;margin-top:-6vh}
.item:not(.focus){opacity:.38;filter:saturate(.55) brightness(.8);transform:scale(.94)}
.item::before{content:"";position:absolute;left:50%;top:-60vh;width:min(150%,900px);height:150vh;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(ellipse 45% 55% at 50% 46%,rgba(255,236,212,.13),rgba(255,236,212,.04) 55%,rgba(255,236,212,0) 75%);opacity:0;transition:opacity .9s}
.item.focus::before{opacity:1}

.frame{position:relative;height:var(--h);aspect-ratio:var(--ar);max-width:72vw;padding:clamp(6px,.8vw,11px);background:var(--frame);
  box-shadow:0 2px 0 rgba(255,255,255,.25) inset,0 34px 60px -24px rgba(0,0,0,.85),0 10px 22px -10px rgba(0,0,0,.6);transition:height .9s cubic-bezier(.3,.7,.2,1)}
.frame .pic{position:relative;width:100%;height:100%;overflow:hidden;background:#2a3330;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.frame img,.frame canvas{display:block;width:100%;height:100%;object-fit:cover}
.open .frame{cursor:pointer}
.open.focus .frame:hover{box-shadow:0 2px 0 rgba(255,255,255,.25) inset,0 40px 70px -24px rgba(0,0,0,.9),0 0 0 2px rgba(240,184,156,.55)}
/* 布展中：盖着一块亚麻布 */
.cloth{position:absolute;inset:0;display:grid;place-items:center;
  background:
    linear-gradient(100deg,rgba(0,0,0,.18),rgba(255,255,255,.06) 22%,rgba(0,0,0,.14) 40%,rgba(255,255,255,.08) 58%,rgba(0,0,0,.2) 80%,rgba(255,255,255,.04)),
    repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,rgba(0,0,0,.05) 1px 3px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,rgba(0,0,0,.05) 1px 3px),
    rgba(205,196,176,.72)}
.cloth span{white-space:nowrap;font-family:var(--f-display);font-size:clamp(11px,1.5vw,21px);letter-spacing:.3em;color:rgba(40,42,38,.75);padding-left:.4em;
  background:rgba(242,238,228,.55);padding:6px 10px 6px 16px;border-radius:2px}

.label{margin-top:clamp(18px,3.2vh,30px);width:min(360px,82vw);background:var(--paper);color:var(--ink);padding:14px 18px 16px;
  box-shadow:0 12px 26px -14px rgba(0,0,0,.8);display:grid;gap:4px;opacity:0;transform:translateY(8px);transition:opacity .6s .15s,transform .6s .15s;pointer-events:none}
.item.focus .label{opacity:1;transform:none;pointer-events:auto}
.label .no{font-family:var(--f-latin);font-style:italic;font-size:13px;color:#7a6f63;display:flex;justify-content:space-between;gap:10px}
.label .no b{font-family:var(--f-body);font-style:normal;font-weight:600;font-size:11px;letter-spacing:.18em;color:var(--sun)}
.label h2{margin:2px 0 0;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.3;letter-spacing:.04em}
.label .fr{font-family:var(--f-latin);font-style:italic;font-size:14px;color:#5d625e;line-height:1.35}
.label .meta{font-size:12.5px;color:#5d625e;line-height:1.6}
.label p{margin:6px 0 0;font-size:14px;line-height:1.75}
.label .go{margin-top:10px;justify-self:start;font:inherit;font-size:14px;letter-spacing:.06em;color:var(--fog);background:var(--ink);border:0;cursor:pointer;
  padding:9px 16px;border-radius:14px 20px 12px 18px / 16px 12px 18px 14px}
.label .go:hover{background:var(--sun)}
.label .soon{margin-top:10px;font-size:12.5px;letter-spacing:.14em;color:#8a8279}
.label .go:focus-visible,.dots button:focus-visible,.corner button:focus-visible{outline:2px solid var(--peach);outline-offset:3px}

/* 展厅入口的墙面文字 */
.intro{width:min(460px,80vw);display:grid;gap:14px;margin-top:-4vh}
.intro .eyebrow{font-size:12.5px;letter-spacing:.3em;color:var(--mist)}
.intro h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(54px,7vw,92px);letter-spacing:.1em;line-height:1.1}
.intro h1 b{color:var(--sun);font-weight:400}
.intro .sub{font-family:var(--f-display);font-size:clamp(19px,1.9vw,24px);line-height:1.5}
.intro p{margin:0;font-size:15px;line-height:1.85;color:#d6d6cc}
.intro .walk{margin-top:6px;font-size:14px;letter-spacing:.12em;color:var(--peach);animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(8px)}}

.corner{position:fixed;z-index:5;font-size:13px;letter-spacing:.16em;color:var(--mist)}
#brand{left:calc(var(--gut-l) + 8px);top:calc(env(safe-area-inset-top,0px) + 16px);font-family:var(--f-display);font-size:17px;letter-spacing:.24em;color:var(--fog)}
#brand b{color:var(--sun);font-weight:400}
.corner button{background:none;border:0;font:inherit;color:inherit;letter-spacing:inherit;padding:8px 10px;cursor:pointer}
.corner button:hover{color:var(--fog)}
.dots{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);display:flex;gap:6px;align-items:center}
.dots button{width:30px;height:24px;padding:0;background:none;border:0;cursor:pointer;display:grid;place-items:center}
.dots button i{display:block;width:9px;height:7px;border-radius:60% 40% 55% 45%;background:rgba(239,234,224,.25);transition:background .4s,transform .4s}
.dots button.on i{background:var(--peach);transform:scale(1.35)}
.dots button.open i{box-shadow:0 0 0 1px rgba(224,105,74,.8)}
#arrowL,#arrowR{position:fixed;z-index:5;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mist);font-size:28px;cursor:pointer;padding:16px;opacity:.6;font-family:var(--f-latin)}
#arrowL{left:calc(var(--gut-l) - 6px)}#arrowR{right:calc(var(--gut-r) - 6px)}
#arrowL:hover,#arrowR:hover{opacity:1;color:var(--fog)}
#veil{position:fixed;inset:0;z-index:20;background:#111917;opacity:0;pointer-events:none;transition:opacity .5s}
@media (min-width:900px) and (min-aspect-ratio:1/1){
  .item:not(.intro-item){flex-direction:row;align-items:flex-end;gap:clamp(22px,2.4vw,36px);margin-top:-4vh}
  .item .label{margin-top:0;width:clamp(260px,22vw,320px);margin-bottom:4px;transform:translateX(-8px)}
  .item.focus .label{transform:none}
}
@media (max-width:700px){
  .item{margin-top:-8vh}
  .label{padding:12px 14px 14px}
  .label h2{font-size:21px}
  .label p{font-size:13.5px}
  #arrowL,#arrowR{display:none}
  .intro{margin-top:0}
}
@media (prefers-reduced-motion:reduce){.item,.frame,.label,.item::before{transition:none}.intro .walk{animation:none}}
</style>
</head>
<body>
<div id="hall" aria-label="印象派展墙，可左右拖动">
  <div id="wall"></div>
  <div id="floor"></div>
  <div id="track"></div>
</div>
<div id="brand" class="corner">印象<b>·</b>画室</div>
<button id="arrowL" type="button" aria-label="上一幅">‹</button>
<button id="arrowR" type="button" aria-label="下一幅">›</button>
<nav class="dots corner" id="dots" aria-label="展位"></nav>
<div id="veil"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const WORKS = [
  { no: '01', title: '印象·日出', fr: 'Impression, soleil levant', year: '1872', size: '48 × 63 厘米', where: '巴黎 · 玛摩丹·莫奈美术馆', theme: '光的一瞬', ar: 63 / 48,
    line: '一个早晨的二十分钟，给整个画派起了名字。拨开晨雾，在画里走一走，再和光赛跑一次。', href: 'sunrise/', img: 'gallery/sunrise-thumb.jpg',
    pre: ['sunrise/sunrise-m.jpg', 'sunrise/plate.jpg', 'sunrise/sun.png', 'sunrise/refl.png', 'sunrise/boat1.png', 'sunrise/boat2.png', 'sunrise/boat3.png'] },
  { no: '02', title: '撑阳伞的女人', fr: 'Femme à l’ombrelle', year: '1875', size: '100 × 81 厘米', where: '华盛顿 · 美国国家美术馆', theme: '风与彩色的阴影', ar: 81 / 100,
    line: '妻子和儿子站在起风的小坡上。吹一阵风，再看看她的白裙子：上面几乎没有一处是纯白。', href: 'parasol/', img: 'gallery/parasol-thumb.jpg', pre: ['parasol/parasol-m.jpg'] },
  { no: '03', title: '干草堆（系列）', fr: 'Meules', year: '1890–1891', size: '系列约 25 幅，每幅约 65 × 100 厘米', where: '分藏于世界各地的美术馆', theme: '时间', ar: 100 / 60,
    line: '同一堆干草，九种光。拖动时间，看它从夏末的清晨，走到雪后的日落。', href: 'haystacks/', img: 'gallery/haystacks-thumb.jpg', pre: ['haystacks/h05.jpg', 'haystacks/h02.jpg', 'haystacks/h06.jpg'] },
  { no: '04', title: '睡莲', fr: 'Nymphéas', year: '1906', size: '系列约 250 幅，1897–1926', where: '这一幅为印刷复制品', theme: '水与倒影', ar: 1000 / 645,
    line: '画里没有天，天只在水里。点一点水面，看看你看到的，有多少是真的。', href: 'lilies/', img: 'gallery/lilies-thumb.jpg', pre: ['lilies/lilies.jpg'] }
];
WORKS.forEach(w => { w.open = true; w.artist = '克劳德·莫奈'; });

/* ---------- 墙面：一层暗绿色的笔触 ---------- */
function paintWall() {
  const h = 900, w = 1800, c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'), r = rng(19);
  x.fillStyle = '#18211f'; x.fillRect(0, 0, w, h);
  const P = [[26, 36, 33], [32, 44, 40], [22, 31, 29], [38, 50, 46], [30, 38, 44], [40, 44, 40]];
  x.lineCap = 'round';
  for (let i = 0; i < 2600; i++) {
    const cx = r() * w, cy = r() * h, a = -0.5 + r() * 0.5 + (r() < 0.5 ? 0 : Math.PI / 2 * 0.15), L = 40 + r() * 110, ww = 10 + r() * 22, col = P[(r() * P.length) | 0];
    for (let k = 0; k < 4; k++) {
      const o = (k / 3 - 0.5) * ww, j = (r() - 0.5) * 8; x.strokeStyle = `rgba(${col[0] + j | 0},${col[1] + j | 0},${col[2] + j | 0},${0.35 + r() * 0.35})`; x.lineWidth = ww / 4 * 1.8;
      const dx = Math.cos(a) * L / 2, dy = Math.sin(a) * L / 2, nx = -Math.sin(a) * o, ny = Math.cos(a) * o;
      for (const off of [0, -w, w]) { x.beginPath(); x.moveTo(cx - dx + nx + off, cy - dy + ny); x.lineTo(cx + dx + nx + off, cy + dy + ny); x.stroke(); }
    }
  }
  const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, 'rgba(8,12,11,.55)'); g.addColorStop(0.35, 'rgba(8,12,11,0)'); g.addColorStop(1, 'rgba(8,12,11,.35)'); x.fillStyle = g; x.fillRect(0, 0, w, h);
  $('#wall').style.backgroundImage = `url(${c.toDataURL('image/jpeg', 0.82)})`;
}
paintWall();

/* ---------- 布展中的画：只留下颜色的印象 ---------- */
function blurPalette(pal, seed, ar) {
  const w = 64, h = Math.round(64 / ar), c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'), r = rng(seed);
  x.fillStyle = `rgb(${pal[0]})`; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 160; i++) { const col = pal[(r() * pal.length) | 0]; x.fillStyle = `rgba(${col},${0.25 + r() * 0.4})`; x.beginPath(); x.ellipse(r() * w, r() * h, 3 + r() * 9, 2 + r() * 5, r() * 3, 0, Math.PI * 2); x.fill(); }
  c.style.filter = 'blur(6px) saturate(.85)'; c.style.transform = 'scale(1.15)'; return c;
}

/* ---------- 搭展墙 ---------- */
const track = $('#track'), dotsEl = $('#dots');
const intro = document.createElement('section'); intro.className = 'item intro-item';
intro.innerHTML = `<div class="intro"><div class="eyebrow">第一展厅 · 克劳德·莫奈（1840–1926）</div><h1>追光<b>·</b>的人</h1>
  <div class="sub">四幅莫奈，看懂印象派在看什么</div>
  <p>1874 年，一群总被官方沙龙拒之门外的画家，自己办了一场展览。一位评论家借莫奈一幅画的名字，嘲笑他们是“印象派”。</p>
  <p>莫奈是这群人里最执着的一个，他画了一辈子的光。这面墙按年份挂着他的四幅画，从三十出头，一直到晚年。</p>
  <div class="walk">${coarse ? '向左滑动，沿着展墙往前走 →' : '拖动、滚动或按 → ，沿着展墙往前走 →'}</div></div>`;
track.appendChild(intro);
const items = [intro];
WORKS.forEach((w, i) => {
  const el = document.createElement('section'); el.className = 'item' + (w.open ? ' open' : ''); el.setAttribute('aria-label', `${w.no} ${w.title}`);
  const ar = w.ar; el.style.setProperty('--ar', ar);
  el.innerHTML = `<div class="frame"><div class="pic"></div></div>
    <div class="label"><div class="no"><span>No. ${w.no}</span><b>${w.theme}</b></div>
      <h2>${w.title}</h2><div class="fr">${w.fr}</div>
      <div class="meta">克劳德·莫奈，${w.year}<br>布面油画 · ${w.size}<br>${w.where}</div>
      <p>${w.line}</p>
      ${w.open ? '<button class="go" type="button">走进这幅画 →</button>' : '<div class="soon">布展中 · 敬请期待</div>'}</div>`;
  const pic = el.querySelector('.pic');
  if (w.open) { const im = new Image(); im.src = w.img; im.alt = `${w.artist}《${w.title}》`; im.draggable = false; pic.appendChild(im); }
  else { pic.appendChild(blurPalette(w.pal, 7 + i * 13, ar)); const cl = document.createElement('div'); cl.className = 'cloth'; cl.innerHTML = '<span>布展中</span>'; pic.appendChild(cl); }
  track.appendChild(el); items.push(el);
  if (w.open) { el.querySelector('.go').addEventListener('click', e => { e.stopPropagation(); enter(el, w); }); }
});
items.forEach((el, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.innerHTML = '<i></i>'; b.setAttribute('aria-label', i ? `${WORKS[i - 1].no} ${WORKS[i - 1].title}` : '展厅入口');
  if (i && WORKS[i - 1].open) b.classList.add('open');
  b.addEventListener('click', () => go(i)); dotsEl.appendChild(b);
});

/* ---------- 画框大小 ---------- */
function sizeFrames() {
  const vh = innerHeight, vw = innerWidth, wide = vw >= 900 && vw >= vh, base = Math.min(vh * (wide ? 0.6 : vw < 700 ? 0.36 : 0.44), 620);
  items.slice(1).forEach(el => { const ar = +el.style.getPropertyValue('--ar'); el.querySelector('.frame').style.setProperty('--h', Math.min(base, vw * (wide ? 0.58 : 0.72) / ar) + 'px'); });
}

/* ---------- 沿着展墙走 ---------- */
let centers = [], x = 0, target = 0, idx = 0, moved = false;
function measure() { centers = items.map(el => el.offsetLeft + el.offsetWidth / 2); target = -(centers[idx] - innerWidth / 2); }
const clampT = t => Math.max(-(centers[centers.length - 1] - innerWidth / 2), Math.min(-(centers[0] - innerWidth / 2), t));
function nearest(t) { const c = innerWidth / 2 - t; let best = 0, bd = Infinity; centers.forEach((v, i) => { const d = Math.abs(v - c); if (d < bd) { bd = d; best = i; } }); return best; }
function go(i) { idx = Math.max(0, Math.min(items.length - 1, i)); target = -(centers[idx] - innerWidth / 2); try { history.replaceState(null, '', idx ? '#' + WORKS[idx - 1].no : location.pathname); } catch (e) {} }
let focusIdx = -1;
function setFocus(i) {
  if (i === focusIdx) return; focusIdx = i;
  items.forEach((el, k) => el.classList.toggle('focus', k === i));
  [...dotsEl.children].forEach((b, k) => b.classList.toggle('on', k === i));
  prefetch(i);
}
function frame() {
  x += (target - x) * (reduce ? 1 : 0.11); if (Math.abs(target - x) < 0.3) x = target;
  track.style.transform = `translate3d(${x}px,0,0)`;
  $('#wall').style.backgroundPosition = `${x * 0.35}px 0`;
  setFocus(nearest(x));
  requestAnimationFrame(frame);
}

const hall = $('#hall');
let snapT;
hall.addEventListener('wheel', e => { e.preventDefault(); const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; target = clampT(target - d * 1.1); clearTimeout(snapT); snapT = setTimeout(() => go(nearest(target)), 160); }, { passive: false });
let drag = null;
hall.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; drag = { sx: e.clientX, sy: e.clientY, st: target, t: performance.now(), lx: e.clientX, v: 0 }; moved = false; hall.setPointerCapture(e.pointerId); hall.classList.add('drag'); });
hall.addEventListener('pointermove', e => {
  if (!drag) return; const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy, d = Math.abs(dx) > Math.abs(dy) * 0.6 ? dx : dy * (coarse ? 1.2 : 0);
  if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
  const now = performance.now(); drag.v = (e.clientX - drag.lx) / Math.max(1, now - drag.t); drag.t = now; drag.lx = e.clientX;
  target = clampT(drag.st + d * 1.15);
});
const end = e => {
  if (!drag) return; hall.classList.remove('drag');
  if (!moved) {
    const hit = document.elementFromPoint(e.clientX, e.clientY), el = hit && hit.closest('.item');
    if (el) { const i = items.indexOf(el); if (i !== focusIdx) go(i); else if (i > 0 && WORKS[i - 1].open && hit.closest('.frame')) enter(el, WORKS[i - 1]); }
    drag = null; return;
  }
  let i = nearest(target); const v = drag.v; if (Math.abs(v) > 0.4) { const cur = nearest(drag.st); if (v < 0 && i <= cur) i = cur + 1; if (v > 0 && i >= cur) i = cur - 1; }
  go(i); drag = null; setTimeout(() => { moved = false; }, 50);
};
hall.addEventListener('pointerup', end); hall.addEventListener('pointercancel', end);
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { go(focusIdx + 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(focusIdx - 1); e.preventDefault(); }
  if (e.key === 'Enter' && focusIdx > 0 && WORKS[focusIdx - 1].open && !e.target.closest('button')) enter(items[focusIdx], WORKS[focusIdx - 1]);
});
$('#arrowL').addEventListener('click', () => go(focusIdx - 1));
$('#arrowR').addEventListener('click', () => go(focusIdx + 1));

/* ---------- 走进画里：画框放大到整个屏幕 ---------- */
function enter(el, w) {
  const img = el.querySelector('img'), r = img.getBoundingClientRect(), veil = $('#veil');
  const clone = img.cloneNode(); Object.assign(clone.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', zIndex: 19, objectFit: 'cover', transition: reduce ? 'none' : 'all .9s cubic-bezier(.6,0,.2,1)' });
  document.body.appendChild(clone);
  const s = Math.max(innerWidth / r.width, innerHeight / r.height);
  requestAnimationFrame(() => requestAnimationFrame(() => { Object.assign(clone.style, { left: (innerWidth - r.width * s) / 2 + 'px', top: (innerHeight - r.height * s) / 2 + 'px', width: r.width * s + 'px', height: r.height * s + 'px', filter: 'blur(2px) brightness(1.15)' }); }));
  setTimeout(() => { veil.style.opacity = 1; }, reduce ? 0 : 650);
  setTimeout(() => { location.href = w.href; }, reduce ? 50 : 1150);
}
addEventListener('pageshow', e => { if (e.persisted) { $('#veil').style.opacity = 0; document.querySelectorAll('body > img').forEach(n => n.remove()); } });

/* ---------- 在哪幅画前停下，就先把那幅的图下载好，点进去不用再等 ---------- */
const fetched = new Set(); let preT;
function prefetch(i) { clearTimeout(preT); if (i < 1) return; preT = setTimeout(() => { const w = WORKS[i - 1]; if (fetched.has(w.no)) return; fetched.add(w.no); w.pre.forEach(f => { const im = new Image(); im.src = f; }); }, 700); }

/* ---------- 启动 ---------- */
sizeFrames();
const fromHash = WORKS.findIndex(w => '#' + w.no === location.hash);
idx = fromHash >= 0 ? fromHash + 1 : 0;
requestAnimationFrame(() => { measure(); x = target; setFocus(idx); requestAnimationFrame(frame); });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { sizeFrames(); measure(); idx = focusIdx; go(idx); }, 120); });
})();
</script>
